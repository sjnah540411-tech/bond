<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채권 포트폴리오 종합관리</title>
<style>
  :root{
    --navy:#0F1B33;
    --navy-2:#16233F;
    --navy-3:#1E2E52;
    --accent:#C9962C;
    --accent-soft:#E9D6A8;
    --bg:#F4F5F8;
    --card:#FFFFFF;
    --text:#1B2430;
    --muted:#6B7686;
    --border:#E4E7EC;
    --gain:#D6455A;
    --loss:#3667C7;
    --safe:#1E8A56;
    --warn:#B4720C;
    --gain-bg:#FCEBEE;
    --loss-bg:#EAF0FB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;font-variant-numeric:tabular-nums;}
  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:248px;flex-shrink:0;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;
  }
  .brand{padding:0 6px 20px 6px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:18px;}
  .brand .mark{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;
    background:var(--accent);color:var(--navy);font-weight:800;font-size:15px;margin-bottom:10px;}
  .brand h1{font-size:15px;margin:0 0 4px 0;font-weight:700;letter-spacing:-0.2px;}
  .brand p{font-size:11.5px;color:rgba(255,255,255,0.55);margin:0;line-height:1.5;}
  nav{display:flex;flex-direction:column;gap:3px;flex:1;}
  .navbtn{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,0.75);
    font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;text-align:left;width:100%;
    transition:background .15s,color .15s;
  }
  .navbtn:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .navbtn.active{background:rgba(201,150,44,0.16);color:#fff;box-shadow:inset 3px 0 0 var(--accent);}
  .navbtn .ico{width:16px;text-align:center;font-size:13px;opacity:.9;}

  .acct-stack{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.12);}
  .acct-stack h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,0.45);margin:0 0 8px 2px;font-weight:700;}
  .stackbar{display:flex;height:8px;border-radius:5px;overflow:hidden;margin-bottom:8px;background:rgba(255,255,255,0.08);}
  .stackbar span{height:100%;}
  .acct-legend{display:flex;flex-direction:column;gap:5px;}
  .acct-legend .row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:rgba(255,255,255,0.68);}
  .acct-legend .dot{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:6px;}

  .sidebar-foot{display:flex;flex-direction:column;gap:6px;margin-top:16px;}
  .savebtn{
    background:var(--accent);color:var(--navy);border:none;padding:11px 12px;border-radius:8px;
    font-size:13px;font-weight:800;cursor:pointer;text-align:center;
  }
  .savebtn:hover{filter:brightness(1.08);}
  .savebtn:active{transform:translateY(1px);}
  .save-status{font-size:10.5px;text-align:center;margin:0 0 6px 0;line-height:1.5;}
  .save-status.dirty{color:#F0B429;font-weight:700;}
  .save-status.clean{color:rgba(255,255,255,0.45);}
  .sync-status{font-size:10px;text-align:center;margin:0 0 8px 0;line-height:1.5;color:rgba(255,255,255,0.5);}
  .sync-diagnostic{font-size:10px;text-align:center;margin:0 0 8px 0;line-height:1.5;padding:6px 8px;border-radius:6px;}
  .sync-diagnostic.info{color:#8FC9A8;background:rgba(30,138,86,0.14);}
  .sync-diagnostic.warn{color:#F0B429;background:rgba(240,180,41,0.14);}
  .sync-diagnostic.error{color:#F08A8A;background:rgba(214,69,90,0.14);}
  .readonly-badge{
    background:rgba(240,180,41,0.16);color:#F0B429;border:1px solid rgba(240,180,41,0.35);
    padding:6px 10px;border-radius:7px;font-size:11px;font-weight:800;text-align:center;margin-bottom:2px;
  }
  .readonly-banner{
    background:#FBF1E5;border:1px solid #F0D9A8;color:#8A5D00;padding:10px 16px;border-radius:8px;
    font-size:12.5px;font-weight:600;margin-bottom:18px;line-height:1.6;
  }
  .ghostbtn{
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);color:rgba(255,255,255,0.85);
    padding:8px 10px;border-radius:7px;font-size:11.5px;cursor:pointer;text-align:center;font-weight:600;
  }
  .ghostbtn:hover{background:rgba(255,255,255,0.12);}

  /* ---------- Main ---------- */
  main{flex:1;padding:26px 32px 60px 32px;max-width:1400px;}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;}
  .topbar h2{font-size:20px;margin:0;font-weight:800;letter-spacing:-0.3px;}
  .topbar .sub{font-size:12.5px;color:var(--muted);margin-top:3px;}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .kpi .lbl{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;}
  .kpi .val{font-size:20px;font-weight:800;letter-spacing:-0.3px;}
  .kpi .val.gain{color:var(--gain);}
  .kpi .val.loss{color:var(--loss);}
  .kpi .sub{font-size:11.5px;color:var(--muted);margin-top:5px;}

  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:22px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
  .card h3{font-size:14px;margin:0 0 14px 0;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
  .card h3 .muted{font-size:11.5px;color:var(--muted);font-weight:500;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{
    background:#F8F9FB;color:var(--muted);font-weight:700;text-transform:uppercase;font-size:10.5px;
    letter-spacing:.3px;padding:9px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;
  }
  th.l{text-align:left;}
  td{padding:9px 10px;border-bottom:1px solid #F0F1F4;text-align:right;white-space:nowrap;}
  td.l{text-align:left;}
  tr:hover td{background:#FAFBFD;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;}
  .tag.CMA{background:#EAF0FB;color:#2B54A8;}
  .tag.ISA{background:#EAF7F0;color:#1E8A56;}
  .tag.IRP{background:#FBF1E5;color:#B4720C;}
  .tag.IMA{background:#F3EAFB;color:#7A34C2;}
  .tag.type{background:#EEF0F4;color:#48505C;}
  .tag.tax-과세{background:#FCEBEE;color:#B3213A;}
  .tag.tax-비과세{background:#EAF7F0;color:#1E8A56;}
  .tag.tax-과세이연{background:#FBF1E5;color:#B4720C;}
  .status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .status-safe{background:#EAF7F0;color:var(--safe);}
  .status-warn{background:#FBF1E5;color:var(--warn);}
  .status-high{background:#FCEBEE;color:var(--gain);}
  .pill-gain{color:var(--gain);font-weight:700;}
  .pill-loss{color:var(--loss);font-weight:700;}

  .btn{
    background:var(--navy);color:#fff;border:none;padding:8px 14px;border-radius:7px;font-size:12.5px;
    font-weight:700;cursor:pointer;
  }
  .btn:hover{background:var(--navy-3);}
  .btn.accent{background:var(--accent);color:var(--navy);}
  .btn.small{padding:5px 10px;font-size:11.5px;}
  .btn.outline{background:#fff;border:1px solid var(--border);color:var(--text);}
  .btn.danger{background:#fff;border:1px solid #F1C6CE;color:var(--gain);}
  .icon-btn{background:none;border:none;cursor:pointer;font-size:13px;color:var(--muted);padding:4px 6px;}
  .icon-btn:hover{color:var(--text);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .toolbar .left{font-size:12.5px;color:var(--muted);}

  .note{font-size:12px;color:var(--muted);background:#F8F9FB;border:1px dashed var(--border);border-radius:8px;padding:10px 12px;margin-bottom:16px;line-height:1.6;}

  select, input[type=text], input[type=number], input[type=date]{
    font-family:inherit;font-size:12.5px;padding:7px 9px;border-radius:6px;border:1px solid var(--border);
    background:#fff;color:var(--text);width:100%;
  }
  select:focus, input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
  label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,27,51,0.45);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:14px;padding:26px 28px;width:640px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal h3{margin:0 0 4px 0;font-size:16px;}
  .modal .desc{font-size:12px;color:var(--muted);margin-bottom:18px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}

  .bond-select{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
  .bond-select select{width:auto;min-width:280px;}

  .chart-wrap{position:relative;height:260px;}
  .chart-wrap.small{height:230px;}

  .help h4{font-size:13.5px;margin:20px 0 8px 0;color:var(--navy);}
  .help p, .help li{font-size:13px;line-height:1.75;color:#3A4250;}
  .help ul{margin:0 0 4px 0;padding-left:20px;}
  .badge-example{font-size:10.5px;color:var(--muted);font-style:italic;}

  .empty{padding:36px 10px;text-align:center;color:var(--muted);font-size:13px;}
  .scrollx{overflow-x:auto;}

  .threshold-bar{position:relative;height:34px;background:#F0F2F5;border-radius:8px;overflow:visible;margin:10px 0 26px 0;}
  .threshold-bar .fill{position:absolute;left:0;top:0;height:100%;border-radius:8px 0 0 8px;transition:width .2s;}
  .threshold-bar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:#8A94A3;}
  .threshold-bar .mark .lbl{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap;font-weight:700;}
  .threshold-bar .cur-lbl{position:absolute;right:8px;top:8px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.25);}

  .month-table th, .month-table td{padding:7px 8px;font-size:11.5px;}
  .month-table th.sticky, .month-table td.sticky{position:sticky;left:0;background:#fff;z-index:2;box-shadow:2px 0 3px rgba(0,0,0,0.03);}
  .month-table th.sticky{background:#F8F9FB;z-index:3;}
  .month-table tr.subtotal td{background:#F8F9FB;font-weight:700;}
  .controls-row{display:flex;gap:14px;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;}
  .controls-row .field{margin-bottom:0;min-width:160px;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#D7DAE1;border-radius:8px;}

  @media (max-width:1000px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .grid2{grid-template-columns:1fr;}
  }
</style>
</head>

/* ============================================================
   PERSISTENCE
   1) localStorage — per-browser/device cache (always used)
   2) GitHub repo file — optional SHARED data store so anyone
      opening the same GitHub Pages link (spouse, PB, etc.)
      sees the latest saved figures, not the seed example data.
      Read (raw.githubusercontent.com) needs no token for a
      public repo. Writing (저장) needs a Personal Access Token
      with Contents read/write on that one repo, entered once
      per browser via "공유 설정(GitHub)".
============================================================ */
const STORAGE_KEY = "bondPortfolioData_v1";
const GH_CONFIG_KEY = "bondPortfolioGithubConfig_v1";

function saveToLocalStorage(){
  try{
    const payload = { holdings, uidCounter, savedAt: new Date().toISOString() };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    return true;
  }catch(e){
    console.error("저장 실패:", e);
    return false;
  }
}
function loadFromLocalStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){
    console.error("불러오기 실패:", e);
    return null;
  }
}
function getGithubConfig(){
  try{
    const raw = localStorage.getItem(GH_CONFIG_KEY);
    if(!raw) return { owner:"", repo:"", path:"data.json", branch:"main", token:"" };
    return { owner:"", repo:"", path:"data.json", branch:"main", token:"", ...JSON.parse(raw) };
  }catch(e){
    return { owner:"", repo:"", path:"data.json", branch:"main", token:"" };
  }
}
function setGithubConfig(cfg){
  try{
    localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg));
    return true;
  }catch(e){
    console.error("설정 저장 실패:", e);
    return false;
  }
}
function githubReadConfigured(cfg){
  cfg = cfg || getGithubConfig();
  return !!(cfg.owner && cfg.repo && cfg.path);
}
function githubWriteConfigured(cfg){
  cfg = cfg || getGithubConfig();
  return githubReadConfigured(cfg) && !!cfg.token;
}
function b64EncodeUtf8(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUtf8(str){
  return decodeURIComponent(escape(atob(str)));
}
/* 공유 데이터 읽기 — 공개 저장소는 토큰 없이도 raw URL로 읽을 수 있음 */
let lastFetchDiagnostic = null; // {level:"info"|"warn"|"error", message:string} — shown in UI, not just console

async function fetchSharedData(){
  const cfg = getGithubConfig();
  if(!githubReadConfigured(cfg)){
    lastFetchDiagnostic = null;
    return null;
  }
  if(window.location.protocol === "file:"){
    lastFetchDiagnostic = {
      level: "warn",
      message: "이 파일을 로컬에서 직접 열어서(file:///...) GitHub 공유 데이터를 불러올 수 없습니다. " +
                "GitHub Pages 주소(https://... .github.io/...)로 접속해야 공유 데이터가 반영됩니다."
    };
    return null;
  }
  try{
    const url = `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch||'main'}/${cfg.path}?t=${Date.now()}`;
    const res = await fetch(url, { cache:"no-store" });
    if(res.status === 404){
      lastFetchDiagnostic = {
        level: "info",
        message: `${cfg.owner}/${cfg.repo}에 아직 ${cfg.path} 파일이 없습니다. 처음 '저장'을 누르면 자동 생성됩니다.`
      };
      return null;
    }
    if(!res.ok){
      lastFetchDiagnostic = {
        level: "error",
        message: `GitHub에서 데이터를 불러오지 못했습니다 (상태 코드 ${res.status}). owner/repo/branch/path 설정이나 저장소가 공개(Public)인지 확인해 주세요.`
      };
      return null;
    }
    const data = await res.json();
    if(!data || !Array.isArray(data.holdings)){
      lastFetchDiagnostic = { level:"error", message: "GitHub의 데이터 파일 형식이 올바르지 않습니다." };
      return null;
    }
    lastFetchDiagnostic = null; // 성공 시 진단 메시지 없음
    return data;
  }catch(e){
    // 네트워크 자체가 막힌 경우 (오프라인, CORS 차단, DNS 실패 등)
    console.warn("GitHub 공유데이터 불러오기 실패(자동으로 로컬/예시 데이터로 대체됨):", e);
    lastFetchDiagnostic = {
      level: "error",
      message: "GitHub 서버에 연결하지 못했습니다. 인터넷 연결을 확인하시거나, owner/repo 이름에 오타가 없는지 " +
                "'공유 설정'에서 확인해 주세요. (인터넷은 정상인데 계속 이 메시지가 뜨면 브라우저나 네트워크가 " +
                "raw.githubusercontent.com 접속을 차단하고 있을 수 있습니다.)"
    };
    return null;
  }
}
/* 공유 데이터 쓰기 — GitHub Contents API, 토큰 필요 */
async function pushSharedData(payload){
  const cfg = getGithubConfig();
  if(!githubWriteConfigured(cfg)){
    return { ok:false, reason:"미설정" };
  }
  const apiBase = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
  const headers = {
    "Authorization": `token ${cfg.token}`,
    "Accept": "application/vnd.github+json"
  };
  try{
    // 1) 기존 파일의 sha 조회 (없으면 새로 생성)
    let sha = undefined;
    const getRes = await fetch(`${apiBase}?ref=${cfg.branch||'main'}`, { headers });
    if(getRes.ok){
      const info = await getRes.json();
      sha = info.sha;
    } else if(getRes.status !== 404){
      const errBody = await getRes.text();
      return { ok:false, reason:`조회 오류(${getRes.status})`, detail: errBody };
    }
    // 2) 파일 생성/갱신
    const content = b64EncodeUtf8(JSON.stringify(payload, null, 2));
    const putRes = await fetch(apiBase, {
      method:"PUT",
      headers: { ...headers, "Content-Type":"application/json" },
      body: JSON.stringify({
        message: `포트폴리오 데이터 저장 (${new Date().toISOString()})`,
        content,
        sha,
        branch: cfg.branch || "main"
      })
    });
    if(!putRes.ok){
      const errBody = await putRes.text();
      return { ok:false, reason:`저장 오류(${putRes.status})`, detail: errBody };
    }
    return { ok:true };
  }catch(e){
    return { ok:false, reason:"네트워크 오류", detail: String(e) };
  }
}
function fmtDateTime(iso){
  if(!iso) return "-";
  try{
    return new Date(iso).toLocaleString("ko-KR", {
      year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"
    });
  }catch(e){ return iso; }
}
function showToast(msg, isError){
  const t = document.createElement("div");
  t.textContent = msg;
  t.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:${isError? '#B3213A' : '#0F1B33'};color:#fff;padding:10px 18px;border-radius:8px;
    font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.28);z-index:200;
    max-width:80vw;text-align:center;opacity:0;transition:opacity .2s;`;
  document.body.appendChild(t);
  if(typeof requestAnimationFrame === "function"){
    requestAnimationFrame(()=>{ t.style.opacity="1"; });
  } else {
    t.style.opacity="1";
  }
  setTimeout(()=>{ t.style.opacity="0"; setTimeout(()=>t.remove(), 300); }, 2600);
}
function isReadOnlyShared(cfg){
  cfg = cfg || getGithubConfig();
  return githubReadConfigured(cfg) && !githubWriteConfigured(cfg);
}
async function saveData(){
  const cfg = getGithubConfig();
  if(isReadOnlyShared(cfg)){
    const proceed = confirm(
      "🔒 읽기 전용 모드입니다.\n\n" +
      "이 변경사항은 GitHub 공유 데이터에는 반영되지 않습니다. 지금 새로고침하거나 나중에 이 앱을 " +
      "다시 열면, 저장했던 내용이 사라지고 GitHub에 공유된 원래 데이터로 되돌아갑니다.\n\n" +
      "그래도 이 기기에만 임시로 저장할까요?"
    );
    if(!proceed) return;
  }
  const localOk = saveToLocalStorage();
  if(githubWriteConfigured(cfg)){
    showToast("저장 중... (GitHub 동기화)");
    const payload = { holdings, uidCounter, savedAt: new Date().toISOString() };
    const result = await pushSharedData(payload);
    if(result.ok){
      isDirty = false;
      lastSavedAt = payload.savedAt;
      lastSyncedAt = payload.savedAt;
      render();
      showToast("✓ 저장되었습니다. (이 기기 + GitHub 공유)");
    } else {
      // GitHub 동기화는 실패했지만 이 기기에는 저장됨
      isDirty = false;
      lastSavedAt = new Date().toISOString();
      render();
      showToast(`이 기기에는 저장됐지만 GitHub 동기화 실패: ${result.reason}`, true);
    }
  } else if(localOk){
    isDirty = false;
    lastSavedAt = new Date().toISOString();
    render();
    showToast(isReadOnlyShared(cfg)
      ? "⚠ 이 기기에 임시 저장됨 — 새로고침하면 GitHub 공유 데이터로 되돌아갑니다."
      : "✓ 저장되었습니다. (이 기기에만 저장 — 공유하려면 '공유 설정'을 사용하세요)");
  } else {
    showToast("저장에 실패했습니다. 'JSON 내보내기'로 백업해 주세요.", true);
  }
}
window.addEventListener("beforeunload", function(e){
  if(isDirty){ e.preventDefault(); e.returnValue = ""; }
});

async function testGithubConnection(){
  const cfg = readGithubForm();
  const el = document.getElementById("gh_test_result");
  el.textContent = "확인 중...";
  if(!githubReadConfigured(cfg)){
    el.textContent = "owner/repo/path를 입력해 주세요.";
    return;
  }
  const shared = await (async ()=>{
    try{
      const url = `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${cfg.path}?t=${Date.now()}`;
      const res = await fetch(url, { cache:"no-store" });
      if(res.ok){ return { ok:true, exists:true }; }
      if(res.status===404){ return { ok:true, exists:false }; }
      return { ok:false, status:res.status };
    }catch(e){ return { ok:false, error:String(e) }; }
  })();
  if(!shared.ok){

let holdings;
let isDirty = false;
let lastSavedAt = null;
let lastSyncedAt = null;
let appReady = false;

async function initApp(){
  // 1) 공유 저장소(GitHub)에 데이터가 있으면 그것을 최우선으로 사용
  //    (배우자/PB 등 다른 사람이 처음 열어도 최신 저장 수치를 보게 됨)
  const shared = await fetchSharedData();
  const local = loadFromLocalStorage();

  if(shared){
    holdings = shared.holdings;
    lastSavedAt = shared.savedAt || null;
    lastSyncedAt = shared.savedAt || null;
  } else if(local && Array.isArray(local.holdings) && local.holdings.length){
    holdings = local.holdings;
    lastSavedAt = local.savedAt || null;
  } else {
    holdings = seedHoldings();
  }
  const maxId = holdings.reduce((m,h)=>{
    const n = parseInt(String(h.id||"h0").replace("h",""),10);
    return isNaN(n)? m : Math.max(m,n);
  }, 0);
  const savedCounter = (shared && shared.uidCounter) || (local && local.uidCounter) || 0;
  uidCounter = savedCounter > maxId ? savedCounter : maxId + 1;

  appReady = true;
  render();
}

async function retrySharedFetch(){
  showToast("GitHub 연결을 다시 시도합니다...");
  const shared = await fetchSharedData();
  if(shared){
    if(isDirty){
      const proceed = confirm(
        "저장되지 않은 변경사항이 있습니다. GitHub의 공유 데이터를 다시 불러오면 " +
        "지금 화면의 변경사항은 사라집니다. 그래도 다시 불러올까요?"
      );
      if(!proceed) return;
    }
    holdings = shared.holdings;
    lastSavedAt = shared.savedAt || null;

  } else {

}
let activeTab = "dashboard";
let selectedBondId = null;
let monthlyStartYM = null; // "YYYY-MM", initialized lazily to earliest settlement month
let monthlyCount = 36;


/* ============================================================
   HELPERS
============================================================ */
function isBond(h){ return BOND_TYPES.includes(h.assetType); }
function isCash(h){ return h.assetType === "예치금"; }
function fmtInt(n){
  if(n===null || n===undefined || isNaN(n)) return "-";
  return Math.round(n).toLocaleString("ko-KR");
}
function fmtNum(n, d=2){
  if(n===null || n===undefined || isNaN(n)) return "-";
  return n.toLocaleString("ko-KR", {minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtPct(n, d=2){
  if(n===null || n===undefined || isNaN(n)) return "-";
  return (n*100).toLocaleString("ko-KR", {minimumFractionDigits:d, maximumFractionDigits:d}) + "%";
}
function fmtDate(s){
  if(!s) return "-";
  return s;
}
function pnlClass(n){
  if(n===null||n===undefined||isNaN(n)) return "";
  return n>=0 ? "pill-gain" : "pill-loss";
}
function addMonths(dateObj, months){
  const d = new Date(dateObj.getTime());
  const day = d.getDate();
  d.setMonth(d.getMonth()+months);
  if(d.getDate() !== day){ d.setDate(0); }
  return d;
}
function parseDate(s){ return new Date(s + "T00:00:00"); }
function toISO(d){ return d.toISOString().slice(0,10); }

function purchaseAmountLocal(h){
  if(isCash(h)) return cashBalanceAt(h, new Date()); // 기초잔고 + 이미 편입된 만기상환금
  if(isBond(h)) return h.quantity * h.pricePct / 100;
  return h.quantity * h.pricePct;
}
function purchaseAmountKRW(h){
  return purchaseAmountLocal(h) * h.fxRate;
}
/* 대시보드 등에서 "현재 보유가치" 합산 시 사용 — 만기가 지나 CMA로 자동 편입 설정된 채권은
   원금이 이미 예치금 잔고 쪽에 반영되었으므로 이중계산을 막기 위해 0으로 처리합니다. */
function currentValueKRW(h){
  if(isBond(h) && h.returnToCashId && isMatured(h)) return 0;
  return purchaseAmountKRW(h);
}

/* Generate the coupon / cash-flow schedule for a bond holding (mirrors the spreadsheet formulas) */
function generateSchedule(h){
  if(!isBond(h) || !h.firstCouponDate || !h.maturityDate || !h.settlementDate) return [];
  const face = h.quantity;
  const coupon = h.couponRate;
  const cycle = h.cycleMonths || 6;
  const maturity = parseDate(h.maturityDate);
  const settle = parseDate(h.settlementDate);
  const fx = h.fxRate;
  const tax = h.taxRate;
  const purchaseKRW = purchaseAmountKRW(h);

  const rows = [];
  let currentDate = parseDate(h.firstCouponDate);
  let prevDate = settle;
  let no = 1;
  let cumKRW = 0;
  let guard = 0;

  while(guard < 400){
    guard++;
    const isFirst = (no === 1);
    const grossInterest = Math.round(face * coupon * cycle / 12);
    let holdInterest;
    if(isFirst){
      const days = (currentDate - prevDate) / 86400000;
      holdInterest = Math.round(face * coupon * Math.max(days,0) / 365);
    } else {
      holdInterest = grossInterest;
    }
    const taxAmt = Math.round(holdInterest * tax);
    const netInterest = holdInterest - taxAmt;
    const isMaturity = currentDate.getTime() >= maturity.getTime();
    const principal = isMaturity ? face : 0;
    const cashLocal = netInterest + principal;
    const cashKRW = cashLocal * fx;
    cumKRW += cashKRW;
    const pnl = cumKRW - purchaseKRW;
    const ret = purchaseKRW !== 0 ? pnl / purchaseKRW : 0;

    rows.push({
      no, date: toISO(currentDate), grossInterest, holdInterest, taxAmt, netInterest,
      principal, cashLocal, cashKRW, cumKRW, pnl, ret
    });

    if(isMaturity) break;
    prevDate = currentDate;
    let next = addMonths(currentDate, cycle);
    if(next.getTime() >= maturity.getTime()) next = new Date(maturity.getTime());
    currentDate = next;
    no++;
  }
  return rows;
}

function bondSummary(h){
  const sched = generateSchedule(h);
  if(sched.length===0) return null;
  const last = sched[sched.length-1];
  const grossInterestSum = sched.reduce((s,r)=>s+r.holdInterest,0);
  const taxSum = sched.reduce((s,r)=>s+r.taxAmt,0);
  const netInterestSum = sched.reduce((s,r)=>s+r.netInterest,0);
  const principalSum = sched.reduce((s,r)=>s+r.principal,0);
  const purchaseLocal = purchaseAmountLocal(h);
  const purchaseKRW = purchaseAmountKRW(h);
  const years = (parseDate(h.maturityDate) - parseDate(h.settlementDate)) / (365*86400000);
  const totalPnlKRW = last.pnl;
  const simpleAnnualReturn = years>0 ? totalPnlKRW / purchaseKRW / years : 0;
  return {
    schedule: sched, purchaseLocal, purchaseKRW, grossInterestSum, taxSum, netInterestSum,
    principalSum, years, totalPnlKRW, simpleAnnualReturn, finalReturn: last.ret
  };
}

function etfSummary(h){
  const purchaseKRW = purchaseAmountKRW(h);
  const purchaseLocal = purchaseAmountLocal(h);
  let evalKRW = null, pnl = null, ret = null;
  if(h.currentPrice !== null && h.currentPrice !== undefined && h.currentPrice !== ""){
    const evalLocal = h.quantity * parseFloat(h.currentPrice);
    evalKRW = evalLocal * h.fxRate;
    pnl = evalKRW - purchaseKRW;
    ret = purchaseKRW !== 0 ? pnl / purchaseKRW : 0;
  }
  return { purchaseLocal, purchaseKRW, evalKRW, pnl, ret };
}

/* ---------- 채권 만기 → CMA 대기자금 자동 편입 ---------- */
function isMatured(h, asOf){
  if(!isBond(h) || !h.maturityDate) return false;
  const today = asOf || new Date(); today.setHours(0,0,0,0);
  return parseDate(h.maturityDate).getTime() <= today.getTime();
}
/* 만기 시 실제로 손에 쥐는 총액(세후, KRW) = 마지막 회차의 세후현금흐름(원금+마지막이자) */
function bondMaturityPayoutKRW(h){
  const s = bondSummary(h);
  if(!s || !s.schedule.length) return 0;
  const last = s.schedule[s.schedule.length-1];
  return last.cashKRW;
}
/* 이 예치금(cashHolding)으로 만기금액이 편입되도록 연결된 채권들의 "편입 시점/금액" 목록.
   편입 시점은 만기일이 속한 달의 "다음 달 1일"로 계산합니다. */
function linkedMaturityInflows(cashHolding){
  return holdings
    .filter(h => isBond(h) && h.returnToCashId === cashHolding.id && h.maturityDate)
    .map(h=>{
      const maturity = parseDate(h.maturityDate);
      const inflowDate = new Date(maturity.getFullYear(), maturity.getMonth()+1, 1);
      return { date: inflowDate, amount: bondMaturityPayoutKRW(h), sourceName: h.name, sourceId: h.id };
    })
    .sort((a,b)=>a.date-b.date);
}
/* 특정 날짜 기준, 만기 편입분까지 반영한 "유효 잔고" */
function cashBalanceAt(h, date){
  let balance = h.quantity; // 기초잔고
  linkedMaturityInflows(h).forEach(inflow=>{
    if(inflow.date.getTime() <= date.getTime()) balance += inflow.amount;
  });
  return balance;
}

/* ---------- CMA 대기자금(예치금): 일별로 발생하는 이자 ---------- */
function dailyInterestGross(h, atDate){
  // 유효잔고(만기편입 반영) x 연이자율 / 365  (세전, 하루치)
  const balance = cashBalanceAt(h, atDate || new Date());
  return balance * h.couponRate / 365;
}
function cashDailyRow(h, atDate){
  const gross = dailyInterestGross(h, atDate);
  const tax = gross * h.taxRate;
  return { gross, tax, net: gross - tax };
}
/* 일자별 누적 순이자 시리즈 (기준일~endDate, 기본값=오늘) — "일자별 발생" 시각화용
   연결된 채권이 만기→CMA로 편입되는 시점부터는 잔고가 계단식으로 늘어나며, 그만큼 이후 일별 이자도 증가합니다. */
function generateCashDailySeries(h, endDate){
  if(!h.settlementDate) return [];
  const start = parseDate(h.settlementDate);
  const end = endDate ? new Date(endDate.getTime()) : new Date();
  end.setHours(0,0,0,0);
  if(end < start) return [];
  const dayRate = h.couponRate / 365;
  const rows = [];
  let cum = 0;
  let d = new Date(start.getTime());
  let guard = 0;
  while(d.getTime() <= end.getTime() && guard < 5000){
    guard++;
    const balance = cashBalanceAt(h, d);
    const gross = balance * dayRate;
    const net = gross - gross * h.taxRate;
    cum += net;
    rows.push({ date: toISO(d), value: cum });
    d = new Date(d.getTime() + 86400000);
  }
  return rows;
}
/* 특정 달(연,월)에 대한 세전/세후 이자 (그 달 중 잔고가 존재했던 일수만큼만 계산)
   만기 편입은 항상 "다음 달 1일"에 일어나도록 설계되어 있어, 한 달 안에서는 잔고가 일정합니다. */
function cashMonthlyValues(h, months){
  const net = new Array(months.length).fill(0);
  const gross = new Array(months.length).fill(0);
  if(!h.settlementDate) return { net, gross };
  const start = parseDate(h.settlementDate);
  const dayRate = h.couponRate / 365;
  months.forEach((key, i)=>{
    const [yy, mm] = key.split("-").map(Number);
    const monthStart = new Date(yy, mm-1, 1);
    const monthEnd = new Date(yy, mm, 0); // 그 달의 마지막 날
    if(monthEnd.getTime() < start.getTime()) return;
    const effStart = monthStart.getTime() < start.getTime() ? start : monthStart;
    const days = Math.round((monthEnd.getTime() - effStart.getTime())/86400000) + 1;
    if(days <= 0) return;
    const balance = cashBalanceAt(h, monthEnd); // 그 달 안에서는 잔고가 일정(편입은 매달 1일에만 발생)
    const g = Math.round(balance * dayRate * days);
    const t = Math.round(g * h.taxRate);
    gross[i] = g;
    net[i] = g - t;
  });
  return { net, gross };
}
function cashAnnualGrossForYear(h, year){
  if(!h.settlementDate) return 0;
  const months = [];
  for(let m=1; m<=12; m++) months.push(`${year}-${String(m).padStart(2,"0")}`);
  const { gross } = cashMonthlyValues(h, months);
  return gross.reduce((s,v)=>s+v, 0);
}

function finalPnlKRW(h){
  if(isCash(h)){
    return null; // 예치금은 원금손익 개념이 없음(이자소득만 발생) — 별도 카드/탭에서 이자소득으로 표시
  } else if(isBond(h)){
    const s = bondSummary(h);
    return s ? s.totalPnlKRW : null;
  } else {
    const s = etfSummary(h);
    return s.pnl;
  }
}

/* ---------- Annual financial-income (이자소득) analysis, by tax category ---------- */
const HEALTH_INS_THRESHOLD = 10000000;   // 건보료 부과대상 산입 기준: 금융소득 1,000만원 초과분
const COMPREHENSIVE_TAX_THRESHOLD = 20000000; // 금융소득종합과세 기준: 2,000만원 초과

function annualIncomeAnalysis(){
  const bonds = holdings.filter(isBond);
  const yearMap = {}; // year -> {과세:0, 비과세:0, 과세이연:0}
  bonds.forEach(h=>{
    const sched = generateSchedule(h);
    sched.forEach(r=>{
      const year = r.date.slice(0,4);
      if(!yearMap[year]) yearMap[year] = {"과세":0, "비과세":0, "과세이연":0};
      const grossKRW = r.holdInterest * h.fxRate; // 세전(원천징수 전) 기준 - 금융소득 판정은 세전 총수입금액 기준
      yearMap[year][h.taxCategory] = (yearMap[year][h.taxCategory]||0) + grossKRW;
    });
  });

  const cashItems = holdings.filter(isCash).filter(h=>h.settlementDate);
  if(cashItems.length){
    const existingYears = Object.keys(yearMap).map(Number);
    const thisYear = new Date().getFullYear();
    const maxYear = existingYears.length ? Math.max(...existingYears, thisYear+2) : thisYear+4;
    cashItems.forEach(h=>{
      const startYear = parseDate(h.settlementDate).getFullYear();
      for(let y=startYear; y<=maxYear; y++){
        const gross = cashAnnualGrossForYear(h, y);
        if(gross<=0) continue;
        const key = String(y);
        if(!yearMap[key]) yearMap[key] = {"과세":0, "비과세":0, "과세이연":0};
        yearMap[key][h.taxCategory] = (yearMap[key][h.taxCategory]||0) + gross;
      }
    });
  }

  return Object.keys(yearMap).sort().map(year=>({ year, ...yearMap[year] }));
}

function incomeStatus(taxableAmt){
  if(taxableAmt > COMPREHENSIVE_TAX_THRESHOLD) return {level:"high", cls:"status-high", label:"금융소득종합과세 대상"};
  if(taxableAmt > HEALTH_INS_THRESHOLD) return {level:"warn", cls:"status-warn", label:"건보료 영향 구간"};
  return {level:"safe", cls:"status-safe", label:"기준 이하(분리과세 종결)"};
}

/* ---------- Monthly cash-flow matrix (이자를 이자발생월 다음 달부터 균등 안분) ---------- */
function ymAdd(year, month, delta){
  let y=year, m=month+delta;
  while(m>12){ m-=12; y+=1; }
  while(m<1){ m+=12; y-=1; }
  return {y, m};
}
function ymKey(y,m){ return `${y}-${String(m).padStart(2,"0")}`; }

function buildMonthlyMatrix(startYear, startMonth, monthCount){
  const months = [];
  let y=startYear, m=startMonth;
  for(let i=0;i<monthCount;i++){
    months.push(ymKey(y,m));
    const nxt = ymAdd(y,m,1); y=nxt.y; m=nxt.m;
  }
  const idx = {}; months.forEach((k,i)=>idx[k]=i);

  const bonds = holdings.filter(isBond);
  const perBond = bonds.map(h=>{
    const net = new Array(months.length).fill(0);
    const gross = new Array(months.length).fill(0);
    const principal = new Array(months.length).fill(0);
    const sched = generateSchedule(h);
    sched.forEach(r=>{
      const d = new Date(r.date + "T00:00:00");
      const span = Math.max(h.cycleMonths || 1, 1);
      const monthlyNet = (r.netInterest * h.fxRate) / span;
      const monthlyGross = (r.holdInterest * h.fxRate) / span;
      let {y:yy, m:mm} = ymAdd(d.getFullYear(), d.getMonth()+1, 1); // 이자발생(확정)월 "다음 달"부터
      for(let k=0;k<span;k++){
        const key = ymKey(yy,mm);
        if(idx[key]!==undefined){ net[idx[key]] += monthlyNet; gross[idx[key]] += monthlyGross; }
        const nxt = ymAdd(yy,mm,1); yy=nxt.y; mm=nxt.m;
      }
      if(r.principal>0){
        const pKey = ymKey(d.getFullYear(), d.getMonth()+1);
        if(idx[pKey]!==undefined) principal[idx[pKey]] += r.principal * h.fxRate;
      }
    });
    return { holding:h, net, gross, principal };
  });

  const cashItems = holdings.filter(isCash);
  const perCash = cashItems.map(h=>{
    const { net, gross } = cashMonthlyValues(h, months);
    return { holding:h, net, gross, principal:new Array(months.length).fill(0) };
  });

  const totalsByCategory = {"과세":new Array(months.length).fill(0), "비과세":new Array(months.length).fill(0), "과세이연":new Array(months.length).fill(0)};
  const totalNet = new Array(months.length).fill(0);
  const totalPrincipal = new Array(months.length).fill(0);
  [...perBond, ...perCash].forEach(pb=>{
    pb.net.forEach((v,i)=>{ totalNet[i]+=v; totalsByCategory[pb.holding.taxCategory][i]+=v; });
    pb.principal.forEach((v,i)=>{ totalPrincipal[i]+=v; });
  });

  return { months, perBond, perCash, totalsByCategory, totalNet, totalPrincipal };
}

/* ============================================================
   DASHBOARD
============================================================ */
function dashboardHTML(){
  const totalKRW = holdings.reduce((s,h)=>s+currentValueKRW(h),0);
  const bondHoldings = holdings.filter(isBond);
  const bondPnlTotal = bondHoldings.reduce((s,h)=>{
    const summ = bondSummary(h);
    return s + (summ? summ.totalPnlKRW : 0);
  },0);
  const etfHoldings = holdings.filter(h=>!isBond(h));
  const etfPnlKnown = etfHoldings.filter(h=>h.currentPrice!==null && h.currentPrice!=="" && h.currentPrice!==undefined);

  const typeTotals = {};
  TYPES.forEach(t=> typeTotals[t] = holdings.filter(h=>h.assetType===t).reduce((s,h)=>s+currentValueKRW(h),0));

  const taxTotals = {"과세":0,"비과세":0,"과세이연":0};
  holdings.forEach(h=>{ taxTotals[h.taxCategory] = (taxTotals[h.taxCategory]||0) + currentValueKRW(h); });

  // combined cash-flow across all bonds, merged by calendar date
  const dateMap = {};
  bondHoldings.forEach(h=>{
    const sched = generateSchedule(h);
    sched.forEach(r=>{ dateMap[r.date] = (dateMap[r.date]||0) + r.cashKRW; });
  });
  const sortedDates = Object.keys(dateMap).sort();
  let running = 0;
  const combinedSeries = sortedDates.map(d=>{ running += dateMap[d]; return {label:d, value:running}; });

  const rows = holdings.map(h=>{
    const pnl = finalPnlKRW(h);
    const source = isBond(h) ? "채권현금흐름" : (isCash(h) ? "CMA대기자금" : "ETF_IMA현황");
    const matured = isBond(h) && h.returnToCashId && isMatured(h);
    const pnlDisplay = isCash(h)
      ? `연이자(세전) ${fmtInt(cashBalanceAt(h, new Date())*h.couponRate)}`
      : (pnl===null ? '평가금액 입력필요' : fmtInt(pnl));
    return `<tr>
      <td class="l"><span class="tag ${h.account}">${h.account}</span></td>
      <td class="l"><span class="tag type">${h.assetType}</span></td>
      <td class="l">${h.name}${matured? '<div class="badge-example">만기됨 → CMA 편입 (총액에서 제외, 대기자금에 합산됨)</div>' : ''}</td>
      <td class="l"><span class="tag tax-${h.taxCategory}">${h.taxCategory}</span></td>
      <td>${h.currency}</td>
      <td class="num">${fmtInt(purchaseAmountKRW(h))}${matured? ' <span class="badge-example">(만기)</span>':''}</td>
      <td class="num ${pnlClass(pnl)}">${pnlDisplay}</td>
      <td class="l">${source}</td>
    </tr>`;
  }).join("");

  return `
    <div class="topbar">
      <div><h2>종합현황</h2><div class="sub">전 계좌(CMA · ISA · IRP · IMA) 통합 대시보드 — 자산 · 세무 · 시간 흐름 다각도 분석</div></div>
    </div>
    <div class="kpi-row">
      <div class="kpi"><div class="lbl">총 투자금액 (KRW)</div><div class="val num">${fmtInt(totalKRW)}</div><div class="sub">보유(예정) ${holdings.length}건</div></div>
      <div class="kpi"><div class="lbl">채권 만기예상 총손익 (세후)</div><div class="val num ${pnlClass(bondPnlTotal)}">${fmtInt(bondPnlTotal)}</div><div class="sub">채권 ${bondHoldings.length}건 기준</div></div>
      <div class="kpi"><div class="lbl">ETF·IMA 평가 입력 현황</div><div class="val">${etfPnlKnown.length} / ${etfHoldings.length}</div><div class="sub">현재가 입력된 건수</div></div>
      <div class="kpi"><div class="lbl">계좌 수</div><div class="val">${ACCOUNTS.length}개</div><div class="sub">CMA · ISA · IRP · IMA</div></div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <h3>전체 채권 통합 누적현금흐름(세후, KRW) <span class="muted">모든 채권을 실제 지급일 기준으로 합산 — 포트폴리오 전체의 시간 흐름 관점</span></h3>
      <div class="chart-wrap"><div style="height:100%">${combinedSeries.length? lineChartSVG(combinedSeries,{color:"#0F1B33"}) : '<div class="empty">등록된 채권이 없습니다.</div>'}</div></div>
    </div>
    <div class="grid2">
      <div class="card">
        <h3>계좌별 투자금액</h3>
        <div class="chart-wrap small" id="chartAcct"></div>
      </div>
      <div class="card">
        <h3>자산유형별 비중</h3>
        <div class="chart-wrap small" id="chartType"></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <h3>과세구분별 비중 <span class="muted">매수금액(KRW) 기준 — 세무 관점</span></h3>
      <div class="chart-wrap small" id="chartTax"></div>
    </div>
    <div class="card">
      <h3>보유자산 손익 현황 <span class="muted">${holdings.length}건</span></h3>
      <div class="scrollx"><table>
        <thead><tr><th class="l">계좌</th><th class="l">자산유형</th><th class="l">종목명</th><th class="l">과세구분</th><th>통화</th>
          <th>매수금액(KRW)</th><th>만기예상/평가손익(KRW)</th><th class="l">손익원천</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="8" class="empty">등록된 자산이 없습니다.</td></tr>`}</tbody>
      </table></div>
    </div>
    <input type="hidden" id="__acctData" value='${JSON.stringify(ACCOUNTS.map(a=>({a,v:holdings.filter(h=>h.account===a).reduce((s,h)=>s+currentValueKRW(h),0)})))}'>
    <input type="hidden" id="__typeData" value='${JSON.stringify(TYPES.map(t=>({t,v:typeTotals[t]})))}'>
    <input type="hidden" id="__taxData" value='${JSON.stringify(TAX_CATS.map(t=>({t,v:taxTotals[t]})))}'>
  `;

function suggestTaxCategory(){

}
function openAdd(){
  document.body.insertAdjacentHTML("beforeend", holdingForm(null));
}
function openEdit(id){
  const h = holdings.find(x=>x.id===id);
  document.body.insertAdjacentHTML("beforeend", holdingForm(h));
}
function closeModal(){
  const o = document.getElementById("modalOverlay");
  if(o) o.remove();
}
function saveHolding(id){
  const val = (sel)=> document.getElementById(sel).value;
  const data = {
    account: val("f_account"),
    assetType: val("f_assetType"),
    name: val("f_name") || "(이름 없음)",
    rating: val("f_rating"),
    currency: val("f_currency") || "KRW",
    issueDate: val("f_issueDate") || null,
    maturityDate: val("f_maturityDate") || null,
    couponRate: (parseFloat(val("f_couponRate"))||0)/100,
    cycleMonths: parseInt(val("f_cycleMonths"))||0,
    settlementDate: val("f_settlementDate") || null,
    firstCouponDate: val("f_firstCouponDate") || null,
    pricePct: parseFloat(val("f_pricePct"))||0,
    quantity: parseFloat(val("f_quantity"))||0,
    fxRate: parseFloat(val("f_fxRate"))||1,
    taxRate: (parseFloat(val("f_taxRate"))||0)/100,
    currentPrice: val("f_currentPrice")===""? null : parseFloat(val("f_currentPrice")),
    taxCategory: val("f_taxCategory") || "과세",
    returnToCashId: val("f_returnToCashId") || "",
    note: val("f_note")
  };
  if(data.assetType === "예치금"){
    // 예치금(대기자금)은 단가/환율/만기 개념이 없으므로 고정값으로 정규화
    data.currency = "KRW";
    data.pricePct = 100;
    data.fxRate = 1;
    data.maturityDate = null;
    data.firstCouponDate = null;
    data.issueDate = null;
    data.currentPrice = null;
    data.returnToCashId = ""; // 예치금 자기 자신은 다른 예치금으로 편입되지 않음
  }
  if(!BOND_TYPES.includes(data.assetType)){
    data.returnToCashId = ""; // 채권이 아니면 만기편입 개념 없음
  }
  if(id){
    const idx = holdings.findIndex(x=>x.id===id);
    holdings[idx] = {...holdings[idx], ...data};
  } else {
    holdings.push({ id: uid(), ...data });
  }
  isDirty = true;
  closeModal();
  render();
}
function deleteHolding(id){
  if(!confirm("이 자산을 목록에서 삭제할까요?")) return;
  holdings = holdings.filter(x=>x.id!==id);
  isDirty = true;
  render();

/* ============================================================
   CMA 대기자금(예치금) — 개별 상품 매수 후 남은 잔고, 일자별 이자
============================================================ */
function cashHTML(){
  const list = holdings.filter(isCash);
  const today = new Date();

  const totalBalance = list.reduce((s,h)=>s+cashBalanceAt(h,today),0);
  const totalDailyGross = list.reduce((s,h)=>s+dailyInterestGross(h,today),0);
  const totalAnnualGross = list.reduce((s,h)=>s+cashBalanceAt(h,today)*h.couponRate,0);
  const totalAnnualTax = list.reduce((s,h)=>s+cashBalanceAt(h,today)*h.couponRate*h.taxRate,0);
  const totalAnnualNet = totalAnnualGross - totalAnnualTax;

  const rows = list.map(h=>{
    const effBalance = cashBalanceAt(h, today);
    const d = cashDailyRow(h, today);
    const monthKey = ymKey(today.getFullYear(), today.getMonth()+1);
    const { net: monthNetArr, gross: monthGrossArr } = cashMonthlyValues(h, [monthKey]);
    const inflows = linkedMaturityInflows(h);
    const landed = inflows.filter(x=>x.date.getTime()<=today.getTime());
    const pending = inflows.filter(x=>x.date.getTime()>today.getTime());
    const inflowNote = (landed.length||pending.length) ? `
      <div class="badge-example">
        ${landed.length? `✓ 편입됨: ${landed.map(x=>`${x.sourceName}(${fmtDate(toISO(x.date))}, +${fmtInt(x.amount)})`).join(', ')}`:''}
        ${landed.length && pending.length? '<br>':''}
        ${pending.length? `⏳ 편입 예정: ${pending.map(x=>`${x.sourceName}(${fmtDate(toISO(x.date))}, +${fmtInt(x.amount)})`).join(', ')}`:''}
      </div>` : '';
    return `<tr>
      <td class="l"><span class="tag ${h.account}">${h.account}</span></td>
      <td class="l">${h.name}<div class="badge-example">${h.note||""}</div>${inflowNote}</td>
      <td class="l"><span class="tag tax-${h.taxCategory}">${h.taxCategory}</span></td>
      <td class="num">${fmtInt(effBalance)}${landed.length?' <span class="badge-example">(기초 '+fmtInt(h.quantity)+'+편입분)</span>':''}</td>
      <td class="num">${fmtPct(h.couponRate,2)}</td>
      <td class="num">${fmtPct(h.taxRate,1)}</td>
      <td>${fmtDate(h.settlementDate)}</td>
      <td class="num">${fmtInt(d.gross)}</td>
      <td class="num">${fmtInt(d.net)}</td>
      <td class="num">${fmtInt(monthGrossArr[0])}</td>
      <td class="num">${fmtInt(monthNetArr[0])}</td>
      <td>
        <button class="icon-btn" title="편집" onclick="openEdit('${h.id}')">✎</button>
        <button class="icon-btn" title="삭제" onclick="deleteHolding('${h.id}')">✕</button>
      </td>
    </tr>`;
  }).join("");

  // 일자별 누적 순이자 시리즈 (전체 예치금 합산, 기준일~오늘) — 만기 편입으로 잔고가 계단식으로 늘어나는 구간 반영
  const dailyDeltas = {};
  list.forEach(h=>{
    if(!h.settlementDate) return;
    const start = parseDate(h.settlementDate);
    const dayRate = h.couponRate/365;
    let d = new Date(start.getTime());
    let guard = 0;
    while(d.getTime() <= today.getTime() && guard < 5000){
      guard++;
      const balance = cashBalanceAt(h, d);
      const gross = balance*dayRate;
      const net = gross - gross*h.taxRate;
      const key = toISO(d);
      dailyDeltas[key] = (dailyDeltas[key]||0) + net;
      d = new Date(d.getTime()+86400000);
    }
  });
  const sortedDates = Object.keys(dailyDeltas).sort();
  let running = 0;
  const combinedSeries = sortedDates.map(k=>{ running += dailyDeltas[k]; return {label:k, value:running}; });

  return `
    <div class="topbar">
      <div><h2>CMA대기자금</h2><div class="sub">개별 상품(채권·ETF) 매수 후 남은 대기자금 잔고와 일자별로 발생하는 이자소득(과세) 현황</div></div>
      <button class="btn accent" onclick="openAddCash()">+ 대기자금 추가</button>
    </div>
    <div class="note">
      CMA 대기자금(RP형/발행어음형 등)은 만기가 없는 수시입출금성 예치금으로, <b>잔고 × 연이자율 ÷ 365</b>로 매일 이자가 발생한다고 가정합니다.
      채권 편집 화면에서 <b>"만기 시 CMA로 자동 편입"</b>을 이 대기자금으로 지정해두면, 그 채권이 만기된 <b>다음 달 1일부터</b> 만기수령액(원금+마지막 이자, 세후)이
      이 잔고에 자동으로 더해져 그 이후 이자 계산에도 반영됩니다.
    </div>
    <div class="kpi-row">
      <div class="kpi"><div class="lbl">대기자금 총 잔고(KRW, 현재기준)</div><div class="val num">${fmtInt(totalBalance)}</div><div class="sub">${list.length}건</div></div>
      <div class="kpi"><div class="lbl">오늘 하루 이자(세전)</div><div class="val num">${fmtInt(totalDailyGross)}</div><div class="sub">잔고 × 연이자율 ÷ 365</div></div>
      <div class="kpi"><div class="lbl">연환산 예상 이자소득(세전)</div><div class="val num">${fmtInt(totalAnnualGross)}</div><div class="sub">세후 ${fmtInt(totalAnnualNet)}</div></div>
      <div class="kpi"><div class="lbl">연환산 세금(예상)</div><div class="val num pill-loss">${fmtInt(totalAnnualTax)}</div><div class="sub">과세 적용시 기준, 오늘 잔고 유지 가정</div></div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <h3>일자별 누적 이자발생 추이(세후) <span class="muted">기준일 ~ 오늘, 만기 편입 반영</span></h3>
      <div class="chart-wrap">${combinedSeries.length? lineChartSVG(combinedSeries,{color:"#3667C7"}) : '<div class="empty">기준일이 입력된 대기자금이 없습니다.</div>'}</div>
    </div>
    <div class="card">
      <h3>대기자금 상세 <span class="muted">${list.length}건</span></h3>
      <div class="scrollx"><table>
        <thead><tr>
          <th class="l">계좌</th><th class="l">종목명</th><th class="l">과세구분</th><th>잔고(KRW, 현재기준)</th>
          <th>연이자율</th><th>세율</th><th class="l">기준일</th><th>일이자(세전)</th><th>일이자(세후)</th>
          <th>이번달 예상(세전)</th><th>이번달 예상(세후)</th><th>관리</th>
        </tr></thead>
        <tbody>${rows || `<tr><td colspan="12" class="empty">등록된 대기자금이 없습니다. '대기자금 추가'로 시작하세요.</td></tr>`}</tbody>
      </table></div>
    </div>
  `;
}

          2,000만원 이하이면 원천징수(통상 15.4%)로 납세의무가 종결되는 분리과세 대상으로 별도의 종합소득세 신고 의무가 없습니다.

/* ============================================================

============================================================ */
function earliestSettlementYM(){
  const items = holdings.filter(h=>isBond(h)||isCash(h)).filter(h=>h.settlementDate);
  if(items.length===0){ const t=new Date(); return {y:t.getFullYear(), m:t.getMonth()+1}; }
  const dates = items.map(h=>new Date(h.settlementDate+"T00:00:00"));
  const min = new Date(Math.min(...dates));
  return {y:min.getFullYear(), m:min.getMonth()+1};
}

      <h4>예시 데이터 안내</h4>

        브라질국채(BNTNF 10 01/01/35, BRL)는 실제 채권모의투자계산서 수치를 그대로 반영했습니다.
        브라질국채(USD, 2035만기) · 저쿠폰(1.3%) 국채 3건(CMA대기자금 전환분 및 2029년 만기채권 재투자분) · VOO/QQQ ETF는
        말씀하신 계획을 바탕으로 한 가상 시나리오입니다. 그 외(ISA 대한항공채, IRP 국고채, IMA)는 구조 설명용
        가상의 예시 값이니 반드시 실제 보유조건으로 교체하세요.</p>
    </div>
  `;
}

/* ============================================================
   IMPORT / EXPORT / RESET
============================================================ */
function exportData(){
  const blob = new Blob([JSON.stringify(holdings, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "채권포트폴리오_데이터.json";
  a.click();
  URL.revokeObjectURL(url);
}
async function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error("형식 오류");
      holdings = data;
      uidCounter = 1;
      holdings.forEach(h=>{ if(!h.id) h.id = uid(); });
      selectedBondId = null;
      isDirty = true; // saveData()가 로컬+깃허브 동기화와 상태 갱신을 함께 처리
      render();
      await saveData();
    }catch(err){
      showToast("파일을 읽는 중 오류가 발생했습니다. 올바른 JSON 파일인지 확인하세요.", true);
    }
  };
  reader.readAsText(file);
  evt.target.value = "";
}
async function resetData(){
  if(!confirm("현재 입력한 데이터가 모두 사라지고 예시 데이터로 초기화됩니다. 계속할까요?")) return;
  uidCounter = 1;
  holdings = seedHoldings();
  selectedBondId = null;
  isDirty = true;
  render();
  await saveData();
}

/* ============================================================
   DEPENDENCY-FREE CHARTS (pure SVG / CSS, no external libraries)
============================================================ */
function fmtCompact(n){
  const sign = n<0 ? "-" : "";
  const abs = Math.abs(n);
  if(abs>=100000000) return sign + (abs/100000000).toFixed(1) + "억";
  if(abs>=10000) return sign + (abs/10000).toFixed(0) + "만";
  return sign + Math.round(abs).toString();
}

function barChartSVG(items, opts={}){
  const W=500, H=230, padL=54, padR=14, padT=16, padB=34;
  if(!items.length || items.every(d=>d.value===0)){
    return `<div class="empty">표시할 데이터가 없습니다.</div>`;
  }
  const max = Math.max(...items.map(d=>d.value), 1);
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const n = items.length;
  const gap = innerW*0.18/(n+1);
  const barW = (innerW - gap*(n+1))/n;
  let grid="", bars="", labels="";
  const steps=4;
  for(let i=0;i<=steps;i++){
    const val = max*i/steps;
    const y = padT+innerH-(val/max)*innerH;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#EEF0F4" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${(y+3).toFixed(1)}" font-size="9.5" fill="#8A94A3" text-anchor="end">${fmtCompact(val)}</text>`;
  }
  items.forEach((d,i)=>{
    const x = padL+gap+i*(barW+gap);
    const h = Math.max((d.value/max)*innerH, 0);
    const y = padT+innerH-h;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="5" fill="${d.color}"/>`;
    bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="10" fill="#48505C" text-anchor="middle">${fmtCompact(d.value)}</text>`;
    labels += `<text x="${(x+barW/2).toFixed(1)}" y="${H-12}" font-size="11" fill="#2B3444" text-anchor="middle" font-weight="700">${d.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%">
    ${grid}${bars}${labels}
  </svg>`;
}

function donutChartHTML(items){
  const total = items.reduce((s,d)=>s+d.value,0);
  let acc=0;
  const stops = items.filter(d=>d.value>0).map(d=>{
    const pct = total>0 ? d.value/total*100 : 0;
    const start=acc; acc+=pct;
    return `${d.color} ${start.toFixed(2)}% ${acc.toFixed(2)}%`;
  }).join(", ");
  const legend = items.map(d=>{
    const pct = total>0 ? (d.value/total*100).toFixed(1) : "0.0";
    return `<div class="row"><span><span class="dot" style="background:${d.color}"></span>${d.label}</span><span class="num">${pct}%</span></div>`;
  }).join("");
  return `
    <div style="display:flex;align-items:center;gap:22px;height:100%;">
      <div style="position:relative;width:140px;height:140px;flex-shrink:0;">
        <div style="width:140px;height:140px;border-radius:50%;background:conic-gradient(${stops || "#E4E7EC 0% 100%"});"></div>
        <div style="position:absolute;inset:24px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
          font-size:11px;color:var(--muted);text-align:center;line-height:1.4;">총액<br><b style="color:var(--text);font-size:12px;">${fmtCompact(total)}</b></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:9px;font-size:12.5px;min-width:0;">${legend}</div>
    </div>`;
}

function lineChartSVG(points, opts={}){
  const W=680, H=260, padL=56, padR=18, padT=18, padB=30;
  const color = opts.color || "#C9962C";
  if(!points.length) return `<div class="empty">표시할 데이터가 없습니다.</div>`;
  const values = points.map(p=>p.value);
  let min = Math.min(0, ...values);
  let max = Math.max(0, ...values);
  if(min===max){ min-=1; max+=1; }
  const rangeY = max-min;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const stepX = points.length>1 ? innerW/(points.length-1) : 0;
  const xy = points.map((p,i)=>{
    const x = padL + i*stepX;
    const y = padT + innerH - ((p.value-min)/rangeY)*innerH;
    return [x,y];
  });
  const linePath = xy.map((pt,i)=> (i===0?"M":"L")+pt[0].toFixed(1)+","+pt[1].toFixed(1)).join(" ");
  const baseY = (padT+innerH).toFixed(1);
  const areaPath = `${linePath} L ${xy[xy.length-1][0].toFixed(1)},${baseY} L ${xy[0][0].toFixed(1)},${baseY} Z`;
  const zeroY = padT + innerH - ((0-min)/rangeY)*innerH;

  let grid="";
  const steps=4;
  for(let i=0;i<=steps;i++){
    const val = min + (rangeY*i/steps);
    const y = padT+innerH-((val-min)/rangeY)*innerH;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#EEF0F4" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${(y+3).toFixed(1)}" font-size="9.5" fill="#8A94A3" text-anchor="end">${fmtCompact(val)}</text>`;
  }
  const zeroLine = `<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" stroke="#C7CCD6" stroke-width="1" stroke-dasharray="3,3"/>`;

  let xLabels = "";
  const labelIdxs = points.length<=6 ? points.map((_,i)=>i) : [0, Math.floor((points.length-1)/2), points.length-1];
  labelIdxs.forEach(i=>{
    xLabels += `<text x="${xy[i][0].toFixed(1)}" y="${H-8}" font-size="9.5" fill="#8A94A3" text-anchor="middle">${points[i].label}</text>`;
  });
  const dots = xy.map(([x,y])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.8" fill="#0F1B33"/>`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%">
    ${grid}${zeroLine}
    <path d="${areaPath}" fill="${color}" fill-opacity="0.14"/>
    <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2.4"/>
    ${dots}
    ${xLabels}
  </svg>`;
}

function stackedBarSVG(labels, series, colors, opts={}){
  // series: {seriesName: [values...]} aligned to labels
  const W=680, H=280, padL=60, padR=16, padT=40, padB=34;
  const seriesNames = Object.keys(series);
  const totals = labels.map((_,i)=> seriesNames.reduce((s,k)=>s+(series[k][i]||0),0));
  const max = Math.max(...totals, opts.refLine2 || 0, 1) * 1.08;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const n = labels.length;
  const gap = innerW*0.2/(n+1);
  const barW = (innerW - gap*(n+1))/n;
  let grid="", bars="", xlabels="";
  const steps=4;
  for(let i=0;i<=steps;i++){
    const val = max*i/steps;
    const y = padT+innerH-(val/max)*innerH;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#EEF0F4" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${(y+3).toFixed(1)}" font-size="9.5" fill="#8A94A3" text-anchor="end">${fmtCompact(val)}</text>`;
  }
  labels.forEach((lab,i)=>{
    const x = padL+gap+i*(barW+gap);
    let yCursor = padT+innerH;
    seriesNames.forEach(sn=>{
      const v = series[sn][i]||0;
      const h = (v/max)*innerH;
      yCursor -= h;
      bars += `<rect x="${x.toFixed(1)}" y="${yCursor.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${colors[sn]}"/>`;
    });
    xlabels += `<text x="${(x+barW/2).toFixed(1)}" y="${H-12}" font-size="11" fill="#2B3444" text-anchor="middle" font-weight="700">${lab}</text>`;
  });
  function refLine(val, label, color){
    if(!val || val>max) return "";
    const y = padT+innerH-(val/max)*innerH;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="${color}" stroke-width="1.4" stroke-dasharray="5,4"/>
      <text x="${W-padR}" y="${(y-4).toFixed(1)}" font-size="10" fill="${color}" text-anchor="end" font-weight="700">${label}</text>`;
  }
  const ref1 = refLine(opts.refLine1, opts.refLine1Label, "#B4720C");
  const ref2 = refLine(opts.refLine2, opts.refLine2Label, "#D6455A");
  const legend = seriesNames.map(sn=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;">
      <span style="width:9px;height:9px;border-radius:2px;background:${colors[sn]};display:inline-block;"></span>${sn}</span>`).join("");
  return `<div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:230px;">
      ${grid}${bars}${ref1}${ref2}${xlabels}
    </svg>
    <div style="font-size:11.5px;color:var(--muted);margin-top:4px;">${legend}</div>
  </div>`;
}
