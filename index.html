<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채권 포트폴리오 종합관리</title>
<style>
  :root{
    --navy:#0F1B33;
    --navy-2:#16233F;
    --navy-3:#1E2E52;
    --accent:#C9962C;
    --accent-soft:#E9D6A8;
    --bg:#F4F5F8;
    --card:#FFFFFF;
    --text:#1B2430;
    --muted:#6B7686;
    --border:#E4E7EC;
    --gain:#D6455A;
    --loss:#3667C7;
    --safe:#1E8A56;
    --warn:#B4720C;
    --gain-bg:#FCEBEE;
    --loss-bg:#EAF0FB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;font-variant-numeric:tabular-nums;}
  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:248px;flex-shrink:0;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;
  }
  .brand{padding:0 6px 20px 6px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:18px;}
  .brand .mark{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;
    background:var(--accent);color:var(--navy);font-weight:800;font-size:15px;margin-bottom:10px;}
  .brand h1{font-size:15px;margin:0 0 4px 0;font-weight:700;letter-spacing:-0.2px;}
  .brand p{font-size:11.5px;color:rgba(255,255,255,0.55);margin:0;line-height:1.5;}
  nav{display:flex;flex-direction:column;gap:3px;flex:1;}
  .navbtn{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,0.75);
    font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;text-align:left;width:100%;
    transition:background .15s,color .15s;
  }
  .navbtn:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .navbtn.active{background:rgba(201,150,44,0.16);color:#fff;box-shadow:inset 3px 0 0 var(--accent);}
  .navbtn .ico{width:16px;text-align:center;font-size:13px;opacity:.9;}

  .acct-stack{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.12);}
  .acct-stack h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,0.45);margin:0 0 8px 2px;font-weight:700;}
  .stackbar{display:flex;height:8px;border-radius:5px;overflow:hidden;margin-bottom:8px;background:rgba(255,255,255,0.08);}
  .stackbar span{height:100%;}
  .acct-legend{display:flex;flex-direction:column;gap:5px;}
  .acct-legend .row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:rgba(255,255,255,0.68);}
  .acct-legend .dot{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:6px;}

  .sidebar-foot{display:flex;flex-direction:column;gap:6px;margin-top:16px;}
  .ghostbtn{
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);color:rgba(255,255,255,0.85);
    padding:8px 10px;border-radius:7px;font-size:11.5px;cursor:pointer;text-align:center;font-weight:600;
  }
  .ghostbtn:hover{background:rgba(255,255,255,0.12);}

  /* ---------- Main ---------- */
  main{flex:1;padding:26px 32px 60px 32px;max-width:1400px;}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;}
  .topbar h2{font-size:20px;margin:0;font-weight:800;letter-spacing:-0.3px;}
  .topbar .sub{font-size:12.5px;color:var(--muted);margin-top:3px;}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .kpi .lbl{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;}
  .kpi .val{font-size:20px;font-weight:800;letter-spacing:-0.3px;}
  .kpi .val.gain{color:var(--gain);}
  .kpi .val.loss{color:var(--loss);}
  .kpi .sub{font-size:11.5px;color:var(--muted);margin-top:5px;}

  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:22px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
  .card h3{font-size:14px;margin:0 0 14px 0;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
  .card h3 .muted{font-size:11.5px;color:var(--muted);font-weight:500;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{
    background:#F8F9FB;color:var(--muted);font-weight:700;text-transform:uppercase;font-size:10.5px;
    letter-spacing:.3px;padding:9px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;
  }
  th.l{text-align:left;}
  td{padding:9px 10px;border-bottom:1px solid #F0F1F4;text-align:right;white-space:nowrap;}
  td.l{text-align:left;}
  tr:hover td{background:#FAFBFD;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;}
  .tag.CMA{background:#EAF0FB;color:#2B54A8;}
  .tag.ISA{background:#EAF7F0;color:#1E8A56;}
  .tag.IRP{background:#FBF1E5;color:#B4720C;}
  .tag.IMA{background:#F3EAFB;color:#7A34C2;}
  .tag.type{background:#EEF0F4;color:#48505C;}
  .tag.tax-과세{background:#FCEBEE;color:#B3213A;}
  .tag.tax-비과세{background:#EAF7F0;color:#1E8A56;}
  .tag.tax-과세이연{background:#FBF1E5;color:#B4720C;}
  .status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .status-safe{background:#EAF7F0;color:var(--safe);}
  .status-warn{background:#FBF1E5;color:var(--warn);}
  .status-high{background:#FCEBEE;color:var(--gain);}
  .pill-gain{color:var(--gain);font-weight:700;}
  .pill-loss{color:var(--loss);font-weight:700;}

  .btn{
    background:var(--navy);color:#fff;border:none;padding:8px 14px;border-radius:7px;font-size:12.5px;
    font-weight:700;cursor:pointer;
  }
  .btn:hover{background:var(--navy-3);}
  .btn.accent{background:var(--accent);color:var(--navy);}
  .btn.small{padding:5px 10px;font-size:11.5px;}
  .btn.outline{background:#fff;border:1px solid var(--border);color:var(--text);}
  .btn.danger{background:#fff;border:1px solid #F1C6CE;color:var(--gain);}
  .icon-btn{background:none;border:none;cursor:pointer;font-size:13px;color:var(--muted);padding:4px 6px;}
  .icon-btn:hover{color:var(--text);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .toolbar .left{font-size:12.5px;color:var(--muted);}

  .note{font-size:12px;color:var(--muted);background:#F8F9FB;border:1px dashed var(--border);border-radius:8px;padding:10px 12px;margin-bottom:16px;line-height:1.6;}

  .field{margin-bottom:12px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,27,51,0.45);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:14px;padding:26px 28px;width:640px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal h3{margin:0 0 4px 0;font-size:16px;}
  .modal .desc{font-size:12px;color:var(--muted);margin-bottom:18px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}

  .bond-select{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
  .bond-select select{width:auto;min-width:280px;}

  .chart-wrap{position:relative;height:260px;}
  .chart-wrap.small{height:230px;}

  .help h4{font-size:13.5px;margin:20px 0 8px 0;color:var(--navy);}
  .help p, .help li{font-size:13px;line-height:1.75;color:#3A4250;}
  .help ul{margin:0 0 4px 0;padding-left:20px;}
  .badge-example{font-size:10.5px;color:var(--muted);font-style:italic;}

  .empty{padding:36px 10px;text-align:center;color:var(--muted);font-size:13px;}
  .scrollx{overflow-x:auto;}

  .threshold-bar{position:relative;height:34px;background:#F0F2F5;border-radius:8px;overflow:visible;margin:10px 0 26px 0;}
  .threshold-bar .fill{position:absolute;left:0;top:0;height:100%;border-radius:8px 0 0 8px;transition:width .2s;}
  .threshold-bar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:#8A94A3;}
  .threshold-bar .mark .lbl{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap;font-weight:700;}
  .threshold-bar .cur-lbl{position:absolute;right:8px;top:8px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.25);}

  .month-table th, .month-table td{padding:7px 8px;font-size:11.5px;}
  .month-table th.sticky, .month-table td.sticky{position:sticky;left:0;background:#fff;z-index:2;box-shadow:2px 0 3px rgba(0,0,0,0.03);}
  .month-table th.sticky{background:#F8F9FB;z-index:3;}
  .month-table tr.subtotal td{background:#F8F9FB;font-weight:700;}
  .controls-row{display:flex;gap:14px;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;}
  .controls-row .field{margin-bottom:0;min-width:160px;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#D7DAE1;border-radius:8px;}

  @media (max-width:1000px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .grid2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

      issueDate:"2004-01-20", maturityDate:"2034-01-20", couponRate:0.08250, cycleMonths:6,

      fxRate:1, taxRate:0.154, currentPrice:null, taxCategory:"과세", note:"매수 예정(플레이스홀더)" },

    { id: uid(), account:"ISA", assetType:"국내채권", name:"대한항공채", rating:"A-", currency:"KRW",
      issueDate:"2024-06-15", maturityDate:"2029-06-15", couponRate:0.0450, cycleMonths:3,

      fxRate:1, taxRate:0.000, currentPrice:null, taxCategory:"비과세", note:"ISA계좌(비과세 한도 초과분은 9.9% 분리과세, 종합과세 제외)" },
    { id: uid(), account:"IRP", assetType:"국내채권", name:"국고채21-8", rating:"국채", currency:"KRW",
      issueDate:"2021-12-10", maturityDate:"2029-12-10", couponRate:0.01375, cycleMonths:6,
      settlementDate:"2026-08-07", firstCouponDate:"2026-12-10", pricePct:92.88, quantity:50000000,
      fxRate:1, taxRate:0.000, currentPrice:null, taxCategory:"과세이연", note:"IRP계좌(인출 시까지 과세이연, 인출 시 연금소득세 등 저율과세)" },

      fxRate:1, taxRate:0.154, currentPrice:null, taxCategory:"과세", note:"IMA는 목표수익률 개념(만기/조기상환 조건 별도 확인)" },

}

let holdings = seedHoldings();
let activeTab = "dashboard";
let selectedBondId = null;
let monthlyStartYM = null; // "YYYY-MM", initialized lazily to earliest settlement month
let monthlyCount = 36;


/* ============================================================
   HELPERS
============================================================ */
function isBond(h){ return BOND_TYPES.includes(h.assetType); }
function fmtInt(n){
  if(n===null || n===undefined || isNaN(n)) return "-";
  return Math.round(n).toLocaleString("ko-KR");
}
function fmtNum(n, d=2){
  if(n===null || n===undefined || isNaN(n)) return "-";
  return n.toLocaleString("ko-KR", {minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtPct(n, d=2){
  if(n===null || n===undefined || isNaN(n)) return "-";
  return (n*100).toLocaleString("ko-KR", {minimumFractionDigits:d, maximumFractionDigits:d}) + "%";
}
function fmtDate(s){
  if(!s) return "-";
  return s;
}
function pnlClass(n){
  if(n===null||n===undefined||isNaN(n)) return "";
  return n>=0 ? "pill-gain" : "pill-loss";
}
function addMonths(dateObj, months){
  const d = new Date(dateObj.getTime());
  const day = d.getDate();
  d.setMonth(d.getMonth()+months);
  if(d.getDate() !== day){ d.setDate(0); }
  return d;
}
function parseDate(s){ return new Date(s + "T00:00:00"); }
function toISO(d){ return d.toISOString().slice(0,10); }

function purchaseAmountLocal(h){
  if(isBond(h)) return h.quantity * h.pricePct / 100;
  return h.quantity * h.pricePct;
}
function purchaseAmountKRW(h){
  return purchaseAmountLocal(h) * h.fxRate;
}

/* Generate the coupon / cash-flow schedule for a bond holding (mirrors the spreadsheet formulas) */
function generateSchedule(h){
  if(!isBond(h) || !h.firstCouponDate || !h.maturityDate || !h.settlementDate) return [];
  const face = h.quantity;
  const coupon = h.couponRate;
  const cycle = h.cycleMonths || 6;
  const maturity = parseDate(h.maturityDate);
  const settle = parseDate(h.settlementDate);
  const fx = h.fxRate;
  const tax = h.taxRate;
  const purchaseKRW = purchaseAmountKRW(h);

  const rows = [];
  let currentDate = parseDate(h.firstCouponDate);
  let prevDate = settle;
  let no = 1;
  let cumKRW = 0;
  let guard = 0;

  while(guard < 400){
    guard++;
    const isFirst = (no === 1);
    const grossInterest = Math.round(face * coupon * cycle / 12);
    let holdInterest;
    if(isFirst){
      const days = (currentDate - prevDate) / 86400000;
      holdInterest = Math.round(face * coupon * Math.max(days,0) / 365);
    } else {
      holdInterest = grossInterest;
    }
    const taxAmt = Math.round(holdInterest * tax);
    const netInterest = holdInterest - taxAmt;
    const isMaturity = currentDate.getTime() >= maturity.getTime();
    const principal = isMaturity ? face : 0;
    const cashLocal = netInterest + principal;
    const cashKRW = cashLocal * fx;
    cumKRW += cashKRW;
    const pnl = cumKRW - purchaseKRW;
    const ret = purchaseKRW !== 0 ? pnl / purchaseKRW : 0;

    rows.push({
      no, date: toISO(currentDate), grossInterest, holdInterest, taxAmt, netInterest,
      principal, cashLocal, cashKRW, cumKRW, pnl, ret
    });

    if(isMaturity) break;
    prevDate = currentDate;
    let next = addMonths(currentDate, cycle);
    if(next.getTime() >= maturity.getTime()) next = new Date(maturity.getTime());
    currentDate = next;
    no++;
  }
  return rows;
}

function bondSummary(h){
  const sched = generateSchedule(h);
  if(sched.length===0) return null;
  const last = sched[sched.length-1];
  const grossInterestSum = sched.reduce((s,r)=>s+r.holdInterest,0);
  const taxSum = sched.reduce((s,r)=>s+r.taxAmt,0);
  const netInterestSum = sched.reduce((s,r)=>s+r.netInterest,0);
  const principalSum = sched.reduce((s,r)=>s+r.principal,0);
  const purchaseLocal = purchaseAmountLocal(h);
  const purchaseKRW = purchaseAmountKRW(h);
  const years = (parseDate(h.maturityDate) - parseDate(h.settlementDate)) / (365*86400000);
  const totalPnlKRW = last.pnl;
  const simpleAnnualReturn = years>0 ? totalPnlKRW / purchaseKRW / years : 0;
  return {
    schedule: sched, purchaseLocal, purchaseKRW, grossInterestSum, taxSum, netInterestSum,
    principalSum, years, totalPnlKRW, simpleAnnualReturn, finalReturn: last.ret
  };
}

function etfSummary(h){
  const purchaseKRW = purchaseAmountKRW(h);
  const purchaseLocal = purchaseAmountLocal(h);
  let evalKRW = null, pnl = null, ret = null;
  if(h.currentPrice !== null && h.currentPrice !== undefined && h.currentPrice !== ""){
    const evalLocal = h.quantity * parseFloat(h.currentPrice);
    evalKRW = evalLocal * h.fxRate;
    pnl = evalKRW - purchaseKRW;
    ret = purchaseKRW !== 0 ? pnl / purchaseKRW : 0;
  }
  return { purchaseLocal, purchaseKRW, evalKRW, pnl, ret };
}

function finalPnlKRW(h){
  if(isBond(h)){
    const s = bondSummary(h);
    return s ? s.totalPnlKRW : null;
  } else {
    const s = etfSummary(h);
    return s.pnl;
  }
}

/* ---------- Annual financial-income (이자소득) analysis, by tax category ---------- */
const HEALTH_INS_THRESHOLD = 10000000;   // 건보료 부과대상 산입 기준: 금융소득 1,000만원 초과분
const COMPREHENSIVE_TAX_THRESHOLD = 20000000; // 금융소득종합과세 기준: 2,000만원 초과

function annualIncomeAnalysis(){
  const bonds = holdings.filter(isBond);
  const yearMap = {}; // year -> {과세:0, 비과세:0, 과세이연:0}
  bonds.forEach(h=>{
    const sched = generateSchedule(h);
    sched.forEach(r=>{
      const year = r.date.slice(0,4);
      if(!yearMap[year]) yearMap[year] = {"과세":0, "비과세":0, "과세이연":0};
      const grossKRW = r.holdInterest * h.fxRate; // 세전(원천징수 전) 기준 - 금융소득 판정은 세전 총수입금액 기준
      yearMap[year][h.taxCategory] = (yearMap[year][h.taxCategory]||0) + grossKRW;
    });
  });
  return Object.keys(yearMap).sort().map(year=>({ year, ...yearMap[year] }));
}

function incomeStatus(taxableAmt){
  if(taxableAmt > COMPREHENSIVE_TAX_THRESHOLD) return {level:"high", cls:"status-high", label:"금융소득종합과세 대상"};
  if(taxableAmt > HEALTH_INS_THRESHOLD) return {level:"warn", cls:"status-warn", label:"건보료 영향 구간"};
  return {level:"safe", cls:"status-safe", label:"기준 이하(분리과세 종결)"};
}

/* ---------- Monthly cash-flow matrix (이자를 이자발생월 다음 달부터 균등 안분) ---------- */
function ymAdd(year, month, delta){
  let y=year, m=month+delta;
  while(m>12){ m-=12; y+=1; }
  while(m<1){ m+=12; y-=1; }
  return {y, m};
}
function ymKey(y,m){ return `${y}-${String(m).padStart(2,"0")}`; }

function buildMonthlyMatrix(startYear, startMonth, monthCount){
  const months = [];
  let y=startYear, m=startMonth;
  for(let i=0;i<monthCount;i++){
    months.push(ymKey(y,m));
    const nxt = ymAdd(y,m,1); y=nxt.y; m=nxt.m;
  }
  const idx = {}; months.forEach((k,i)=>idx[k]=i);

  const bonds = holdings.filter(isBond);
  const perBond = bonds.map(h=>{
    const net = new Array(months.length).fill(0);
    const gross = new Array(months.length).fill(0);
    const principal = new Array(months.length).fill(0);
    const sched = generateSchedule(h);
    sched.forEach(r=>{
      const d = new Date(r.date + "T00:00:00");
      const span = Math.max(h.cycleMonths || 1, 1);
      const monthlyNet = (r.netInterest * h.fxRate) / span;
      const monthlyGross = (r.holdInterest * h.fxRate) / span;
      let {y:yy, m:mm} = ymAdd(d.getFullYear(), d.getMonth()+1, 1); // 이자발생(확정)월 "다음 달"부터
      for(let k=0;k<span;k++){
        const key = ymKey(yy,mm);
        if(idx[key]!==undefined){ net[idx[key]] += monthlyNet; gross[idx[key]] += monthlyGross; }
        const nxt = ymAdd(yy,mm,1); yy=nxt.y; mm=nxt.m;
      }
      if(r.principal>0){
        const pKey = ymKey(d.getFullYear(), d.getMonth()+1);
        if(idx[pKey]!==undefined) principal[idx[pKey]] += r.principal * h.fxRate;
      }
    });
    return { holding:h, net, gross, principal };
  });

  const totalsByCategory = {"과세":new Array(months.length).fill(0), "비과세":new Array(months.length).fill(0), "과세이연":new Array(months.length).fill(0)};
  const totalNet = new Array(months.length).fill(0);
  const totalPrincipal = new Array(months.length).fill(0);
  perBond.forEach(pb=>{
    pb.net.forEach((v,i)=>{ totalNet[i]+=v; totalsByCategory[pb.holding.taxCategory][i]+=v; });
    pb.principal.forEach((v,i)=>{ totalPrincipal[i]+=v; });
  });

  return { months, perBond, totalsByCategory, totalNet, totalPrincipal };
}

  document.getElementById("priceLabel").textContent = bond? "매수단가(%, 액면100기준)" : "매수단가(현지통화/좌)";
  document.getElementById("qtyLabel").textContent = bond? "매수수량(액면금액)" : "매수수량(좌수)";
}
function suggestTaxCategory(){
  const acct = document.getElementById("f_account").value;
  const sel = document.getElementById("f_taxCategory");
  if(sel) sel.value = defaultTaxCategory(acct);
}
function openAdd(){
  document.body.insertAdjacentHTML("beforeend", holdingForm(null));
}
function openEdit(id){
  const h = holdings.find(x=>x.id===id);
  document.body.insertAdjacentHTML("beforeend", holdingForm(h));
}
function closeModal(){
  const o = document.getElementById("modalOverlay");
  if(o) o.remove();
}
function saveHolding(id){
  const val = (sel)=> document.getElementById(sel).value;
  const data = {
    account: val("f_account"),
    assetType: val("f_assetType"),
    name: val("f_name") || "(이름 없음)",
    rating: val("f_rating"),
    currency: val("f_currency") || "KRW",
    issueDate: val("f_issueDate") || null,
    maturityDate: val("f_maturityDate") || null,
    couponRate: (parseFloat(val("f_couponRate"))||0)/100,
    cycleMonths: parseInt(val("f_cycleMonths"))||0,
    settlementDate: val("f_settlementDate") || null,
    firstCouponDate: val("f_firstCouponDate") || null,
    pricePct: parseFloat(val("f_pricePct"))||0,
    quantity: parseFloat(val("f_quantity"))||0,
    fxRate: parseFloat(val("f_fxRate"))||1,
    taxRate: (parseFloat(val("f_taxRate"))||0)/100,
    currentPrice: val("f_currentPrice")===""? null : parseFloat(val("f_currentPrice")),
    taxCategory: val("f_taxCategory") || "과세",
    note: val("f_note")
  };
  if(id){
    const idx = holdings.findIndex(x=>x.id===id);
    holdings[idx] = {...holdings[idx], ...data};
  } else {
    holdings.push({ id: uid(), ...data });
  }
  closeModal();
  render();
}
function deleteHolding(id){
  if(!confirm("이 자산을 목록에서 삭제할까요?")) return;
  holdings = holdings.filter(x=>x.id!==id);
  render();
}

      <b>ISA는 비과세</b>(순소득 한도 내, 초과분은 9.9% 분리과세로 종합과세 제외), <b>IRP는 과세이연</b>(인출 전까지 당해연도 금융소득에 미산입, 인출 시 저율의 연금소득세 등 별도 과세)로 분류합니다.

      ${stackedBarSVG(rows.map(r=>r.year), barSeries, acctColors, {
        refLine1:HEALTH_INS_THRESHOLD, refLine1Label:"건보료 기준 1,000만원",

      </table></div>
    </div>

      <div class="card">

          국민건강보험법령상 이자·배당 등 금융소득이 연 <b>1,000만원을 초과</b>하면 그 초과금액이 건강보험료 부과대상 소득(보수외소득)에 산입됩니다.
          피부양자로 등록되어 있는 경우 금융소득이 연 <b>2,000만원을 초과</b>하면 피부양자 자격을 상실하여 지역가입자로 전환될 수 있으므로 특히 유의해야 합니다.
        </p>
        <div class="status-pill ${overallStatus.cls}" style="margin-top:6px;">현재 최대 연도 기준: ${overallStatus.label}</div>
      </div>
      <div class="card">

          6.6%~49.5%(지방소득세 포함)의 누진세율로 종합소득세를 신고·납부해야 합니다(이미 원천징수된 세액은 기납부세액으로 공제).
          2,000만원 이하이면 원천징수(통상 15.4%)로 납세의무가 종결되는 분리과세 대상으로 별도의 종합소득세 신고 의무가 없습니다.
        </p>
      </div>
    </div>

============================================================ */
function earliestSettlementYM(){
  const bonds = holdings.filter(isBond).filter(h=>h.settlementDate);
  if(bonds.length===0){ const t=new Date(); return {y:t.getFullYear(), m:t.getMonth()+1}; }
  const dates = bonds.map(h=>new Date(h.settlementDate+"T00:00:00"));
  const min = new Date(Math.min(...dates));
  return {y:min.getFullYear(), m:min.getMonth()+1};
}

    monthlyStartYM = ymKey(e.y, e.m);

        </tr></thead>
        <tbody>
          ${bondRows || `<tr><td class="l sticky">등록된 채권 없음</td></tr>`}
          ${totalRow}
          ${catRows}
          ${principalRow}
        </tbody>
      </table></div>
    </div>
  `;
}

/* ============================================================

============================================================ */
function exportData(){
  const blob = new Blob([JSON.stringify(holdings, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "채권포트폴리오_데이터.json";
  a.click();
  URL.revokeObjectURL(url);
}
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error("형식 오류");
      holdings = data;
      uidCounter = 1;
      holdings.forEach(h=>{ if(!h.id) h.id = uid(); });
      selectedBondId = null;
      render();
      alert("데이터를 불러왔습니다.");
    }catch(err){
      alert("파일을 읽는 중 오류가 발생했습니다. 올바른 JSON 파일인지 확인하세요.");
    }
  };
  reader.readAsText(file);
  evt.target.value = "";
}
function resetData(){
  if(!confirm("현재 입력한 데이터가 모두 사라지고 예시 데이터로 초기화됩니다. 계속할까요?")) return;
  uidCounter = 1;
  holdings = seedHoldings();
  selectedBondId = null;
  render();
}

/* ============================================================
   DEPENDENCY-FREE CHARTS (pure SVG / CSS, no external libraries)
============================================================ */
function fmtCompact(n){
  const sign = n<0 ? "-" : "";
  const abs = Math.abs(n);
  if(abs>=100000000) return sign + (abs/100000000).toFixed(1) + "억";
  if(abs>=10000) return sign + (abs/10000).toFixed(0) + "만";
  return sign + Math.round(abs).toString();
}

function barChartSVG(items, opts={}){
  const W=500, H=230, padL=54, padR=14, padT=16, padB=34;
  if(!items.length || items.every(d=>d.value===0)){
    return `<div class="empty">표시할 데이터가 없습니다.</div>`;
  }
  const max = Math.max(...items.map(d=>d.value), 1);
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const n = items.length;
  const gap = innerW*0.18/(n+1);
  const barW = (innerW - gap*(n+1))/n;
  let grid="", bars="", labels="";
  const steps=4;
  for(let i=0;i<=steps;i++){
    const val = max*i/steps;
    const y = padT+innerH-(val/max)*innerH;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#EEF0F4" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${(y+3).toFixed(1)}" font-size="9.5" fill="#8A94A3" text-anchor="end">${fmtCompact(val)}</text>`;
  }
  items.forEach((d,i)=>{
    const x = padL+gap+i*(barW+gap);
    const h = Math.max((d.value/max)*innerH, 0);
    const y = padT+innerH-h;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="5" fill="${d.color}"/>`;
    bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="10" fill="#48505C" text-anchor="middle">${fmtCompact(d.value)}</text>`;
    labels += `<text x="${(x+barW/2).toFixed(1)}" y="${H-12}" font-size="11" fill="#2B3444" text-anchor="middle" font-weight="700">${d.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%">
    ${grid}${bars}${labels}
  </svg>`;
}

function donutChartHTML(items){
  const total = items.reduce((s,d)=>s+d.value,0);
  let acc=0;
  const stops = items.filter(d=>d.value>0).map(d=>{
    const pct = total>0 ? d.value/total*100 : 0;
    const start=acc; acc+=pct;
    return `${d.color} ${start.toFixed(2)}% ${acc.toFixed(2)}%`;
  }).join(", ");
  const legend = items.map(d=>{
    const pct = total>0 ? (d.value/total*100).toFixed(1) : "0.0";
    return `<div class="row"><span><span class="dot" style="background:${d.color}"></span>${d.label}</span><span class="num">${pct}%</span></div>`;
  }).join("");
  return `
    <div style="display:flex;align-items:center;gap:22px;height:100%;">
      <div style="position:relative;width:140px;height:140px;flex-shrink:0;">
        <div style="width:140px;height:140px;border-radius:50%;background:conic-gradient(${stops || "#E4E7EC 0% 100%"});"></div>
        <div style="position:absolute;inset:24px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
          font-size:11px;color:var(--muted);text-align:center;line-height:1.4;">총액<br><b style="color:var(--text);font-size:12px;">${fmtCompact(total)}</b></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:9px;font-size:12.5px;min-width:0;">${legend}</div>
    </div>`;
}

function lineChartSVG(points, opts={}){
  const W=680, H=260, padL=56, padR=18, padT=18, padB=30;
  const color = opts.color || "#C9962C";
  if(!points.length) return `<div class="empty">표시할 데이터가 없습니다.</div>`;
  const values = points.map(p=>p.value);
  let min = Math.min(0, ...values);
  let max = Math.max(0, ...values);
  if(min===max){ min-=1; max+=1; }
  const rangeY = max-min;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const stepX = points.length>1 ? innerW/(points.length-1) : 0;
  const xy = points.map((p,i)=>{
    const x = padL + i*stepX;
    const y = padT + innerH - ((p.value-min)/rangeY)*innerH;
    return [x,y];
  });
  const linePath = xy.map((pt,i)=> (i===0?"M":"L")+pt[0].toFixed(1)+","+pt[1].toFixed(1)).join(" ");
  const baseY = (padT+innerH).toFixed(1);
  const areaPath = `${linePath} L ${xy[xy.length-1][0].toFixed(1)},${baseY} L ${xy[0][0].toFixed(1)},${baseY} Z`;
  const zeroY = padT + innerH - ((0-min)/rangeY)*innerH;

  let grid="";
  const steps=4;
  for(let i=0;i<=steps;i++){
    const val = min + (rangeY*i/steps);
    const y = padT+innerH-((val-min)/rangeY)*innerH;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#EEF0F4" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${(y+3).toFixed(1)}" font-size="9.5" fill="#8A94A3" text-anchor="end">${fmtCompact(val)}</text>`;
  }
  const zeroLine = `<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" stroke="#C7CCD6" stroke-width="1" stroke-dasharray="3,3"/>`;

  let xLabels = "";
  const labelIdxs = points.length<=6 ? points.map((_,i)=>i) : [0, Math.floor((points.length-1)/2), points.length-1];
  labelIdxs.forEach(i=>{
    xLabels += `<text x="${xy[i][0].toFixed(1)}" y="${H-8}" font-size="9.5" fill="#8A94A3" text-anchor="middle">${points[i].label}</text>`;
  });
  const dots = xy.map(([x,y])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.8" fill="#0F1B33"/>`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%">
    ${grid}${zeroLine}
    <path d="${areaPath}" fill="${color}" fill-opacity="0.14"/>
    <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2.4"/>
    ${dots}
    ${xLabels}
  </svg>`;
}

function stackedBarSVG(labels, series, colors, opts={}){
  // series: {seriesName: [values...]} aligned to labels
  const W=680, H=280, padL=60, padR=16, padT=40, padB=34;
  const seriesNames = Object.keys(series);
  const totals = labels.map((_,i)=> seriesNames.reduce((s,k)=>s+(series[k][i]||0),0));
  const max = Math.max(...totals, opts.refLine2 || 0, 1) * 1.08;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const n = labels.length;
  const gap = innerW*0.2/(n+1);
  const barW = (innerW - gap*(n+1))/n;
  let grid="", bars="", xlabels="";
  const steps=4;
  for(let i=0;i<=steps;i++){
    const val = max*i/steps;
    const y = padT+innerH-(val/max)*innerH;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#EEF0F4" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${(y+3).toFixed(1)}" font-size="9.5" fill="#8A94A3" text-anchor="end">${fmtCompact(val)}</text>`;
  }
  labels.forEach((lab,i)=>{
    const x = padL+gap+i*(barW+gap);
    let yCursor = padT+innerH;
    seriesNames.forEach(sn=>{
      const v = series[sn][i]||0;
      const h = (v/max)*innerH;
      yCursor -= h;
      bars += `<rect x="${x.toFixed(1)}" y="${yCursor.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${colors[sn]}"/>`;
    });
    xlabels += `<text x="${(x+barW/2).toFixed(1)}" y="${H-12}" font-size="11" fill="#2B3444" text-anchor="middle" font-weight="700">${lab}</text>`;
  });
  function refLine(val, label, color){
    if(!val || val>max) return "";
    const y = padT+innerH-(val/max)*innerH;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="${color}" stroke-width="1.4" stroke-dasharray="5,4"/>
      <text x="${W-padR}" y="${(y-4).toFixed(1)}" font-size="10" fill="${color}" text-anchor="end" font-weight="700">${label}</text>`;
  }
  const ref1 = refLine(opts.refLine1, opts.refLine1Label, "#B4720C");
  const ref2 = refLine(opts.refLine2, opts.refLine2Label, "#D6455A");
  const legend = seriesNames.map(sn=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;">
      <span style="width:9px;height:9px;border-radius:2px;background:${colors[sn]};display:inline-block;"></span>${sn}</span>`).join("");
  return `<div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:230px;">
      ${grid}${bars}${ref1}${ref2}${xlabels}
    </svg>
    <div style="font-size:11.5px;color:var(--muted);margin-top:4px;">${legend}</div>
  </div>`;
}

  if(activeTab==="dashboard") drawDashboardCharts();
